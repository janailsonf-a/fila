x-mysql-health: &mysql-health
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  rabbitmq:
    image: rabbitmq:3-management
    restart: unless-stopped
    environment:
      # guest só vale em localhost; usuário próprio funciona entre containers
      RABBITMQ_DEFAULT_USER: fila
      RABBITMQ_DEFAULT_PASS: fila
    volumes:
      # habilita o plugin de métricas (Prometheus) em :15692
      - ./observability/rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro
    ports:
      - "15672:15672"   # management UI (fila/fila)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-orders:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    restart: unless-stopped
    healthcheck: *mysql-health

  mysql-inventory:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    restart: unless-stopped
    healthcheck: *mysql-health

  mysql-payment:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    restart: unless-stopped
    healthcheck: *mysql-health

  orders:
    build: ./services/orders
    environment: *orders-env
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped
    ports:
      - "8080:8000"
    depends_on:
      mysql-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-worker:
    build: ./services/orders
    environment: *orders-env
    command: php artisan queue:work rabbitmq --queue=orders --tries=3
    restart: unless-stopped
    depends_on:
      orders:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build: ./services/inventory
    environment: *inventory-env
    command: sh -c "php artisan migrate --seed --force && php artisan queue:work rabbitmq --queue=inventory --tries=3"
    restart: unless-stopped
    depends_on:
      mysql-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # API de leitura dos assentos (consumida pelo frontend p/ montar a sala)
  inventory-api:
    build: ./services/inventory
    environment: *inventory-env
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    restart: unless-stopped
    depends_on:
      mysql-inventory:
        condition: service_healthy

  payment-worker:
    build: ./services/payment
    environment: *payment-env
    command: sh -c "php artisan migrate --force && php artisan queue:work rabbitmq --queue=payment --tries=3"
    restart: unless-stopped
    depends_on:
      mysql-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build: ./services/notification
    environment: *notification-env
    command: sh -c "php artisan migrate --force && php artisan queue:work rabbitmq --queue=notification --tries=3"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  prometheus:
    image: prom/prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    restart: unless-stopped
    depends_on:
      rabbitmq:
        condition: service_healthy

  grafana:
    image: grafana/grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: fila
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - prometheus

  web:
    build: ./web
    environment:
      ORDERS_API_URL: http://orders:8000
      INVENTORY_API_URL: http://inventory-api:8000
    ports:
      - "3002:3000"
    restart: unless-stopped
    depends_on:
      - orders
      - inventory-api
