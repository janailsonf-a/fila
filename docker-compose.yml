# Fila — Fase 1: orders + inventory event-driven via RabbitMQ.
# Cada serviço tem seu próprio MySQL (isolamento de dados).

x-orders-env: &orders-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:90HHtjzVqIp6xS6rCWvDzh5Py0sz08X12VVaU8t8znk=
  DB_CONNECTION: mysql
  DB_HOST: mysql-orders
  DB_PORT: "3306"
  DB_DATABASE: orders
  DB_USERNAME: fila
  DB_PASSWORD: fila
  QUEUE_CONNECTION: rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest

x-inventory-env: &inventory-env
  APP_ENV: local
  APP_DEBUG: "true"
  APP_KEY: base64:+UXjkaiWYMjZFS0wJMTt7KPSvktgPsrccWee9IAKSGk=
  DB_CONNECTION: mysql
  DB_HOST: mysql-inventory
  DB_PORT: "3306"
  DB_DATABASE: inventory
  DB_USERNAME: fila
  DB_PASSWORD: fila
  QUEUE_CONNECTION: rabbitmq
  RABBITMQ_HOST: rabbitmq
  RABBITMQ_PORT: "5672"
  RABBITMQ_USER: guest
  RABBITMQ_PASSWORD: guest

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-orders:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-inventory:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 10

  orders:
    build: ./services/orders
    environment: *orders-env
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8080:8000"
    depends_on:
      mysql-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-worker:
    build: ./services/orders
    environment: *orders-env
    command: php artisan queue:work rabbitmq --queue=orders --tries=3
    depends_on:
      orders:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build: ./services/inventory
    environment: *inventory-env
    command: sh -c "php artisan migrate --seed --force && php artisan queue:work rabbitmq --queue=inventory --tries=3"
    depends_on:
      mysql-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
