x-mysql-health: &mysql-health
  test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
  interval: 10s
  timeout: 5s
  retries: 10

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "15672:15672"   # management UI (guest/guest)
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  mysql-orders:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: orders
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    healthcheck: *mysql-health

  mysql-inventory:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: inventory
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    healthcheck: *mysql-health

  mysql-payment:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: payment
      MYSQL_USER: fila
      MYSQL_PASSWORD: fila
    healthcheck: *mysql-health

  orders:
    build: ./services/orders
    environment: *orders-env
    command: sh -c "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=8000"
    ports:
      - "8080:8000"
    depends_on:
      mysql-orders:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orders-worker:
    build: ./services/orders
    environment: *orders-env
    command: php artisan queue:work rabbitmq --queue=orders --tries=3
    depends_on:
      orders:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  inventory-worker:
    build: ./services/inventory
    environment: *inventory-env
    command: sh -c "php artisan migrate --seed --force && php artisan queue:work rabbitmq --queue=inventory --tries=3"
    depends_on:
      mysql-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  payment-worker:
    build: ./services/payment
    environment: *payment-env
    command: sh -c "php artisan migrate --force && php artisan queue:work rabbitmq --queue=payment --tries=3"
    depends_on:
      mysql-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  notification-worker:
    build: ./services/notification
    environment: *notification-env
    command: sh -c "php artisan migrate --force && php artisan queue:work rabbitmq --queue=notification --tries=3"
    depends_on:
      rabbitmq:
        condition: service_healthy
